<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote NIP-07</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-width: 320px;
            background: #1a1a2e;
            color: #eee;
        }

        .container {
            padding: 16px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 16px;
            color: #9b59b6;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 svg {
            width: 20px;
            height: 20px;
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
        }

        .btn-icon:hover {
            background: #252542;
            color: #eee;
        }

        .btn-icon svg {
            width: 20px;
            height: 20px;
            display: block;
        }

        /* Pages */
        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* Current Site View */
        .current-site {
            text-align: center;
            padding: 16px 0;
        }

        .current-host {
            font-size: 14px;
            color: #888;
            margin-bottom: 8px;
        }

        .current-host strong {
            color: #9b59b6;
            font-weight: 600;
        }

        /* Connected State */
        .connected-state {
            background: #252542;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .connected-icon {
            width: 48px;
            height: 48px;
            background: #27ae60;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
        }

        .connected-icon svg {
            width: 24px;
            height: 24px;
            color: white;
        }

        .connected-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .connected-pubkey {
            font-size: 12px;
            color: #888;
            font-family: monospace;
            word-break: break-all;
        }

        .btn-disconnect {
            margin-top: 16px;
            background: transparent;
            border: 1px solid #e74c3c;
            color: #e74c3c;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-disconnect:hover {
            background: #e74c3c;
            color: white;
        }

        /* QR Connect State */
        .qr-state {
            text-align: center;
        }

        .qr-title {
            font-size: 14px;
            margin-bottom: 4px;
        }

        .qr-subtitle {
            font-size: 12px;
            color: #888;
            margin-bottom: 16px;
        }

        .qr-container {
            background: white;
            padding: 16px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 16px;
        }

        .qr-container canvas {
            display: block;
        }

        .waiting-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #888;
            font-size: 12px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #444;
            border-top-color: #9b59b6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Not Connected State */
        .not-connected-state {
            text-align: center;
            padding: 32px 16px;
            color: #888;
        }

        .not-connected-state svg {
            width: 48px;
            height: 48px;
            opacity: 0.5;
            margin-bottom: 12px;
        }

        /* Sites List Page */
        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .site-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .site-item {
            background: #252542;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-info {
            flex: 1;
            min-width: 0;
        }

        .site-host {
            font-weight: 500;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .site-pubkey {
            font-size: 11px;
            color: #888;
            font-family: monospace;
        }

        .btn-remove {
            background: transparent;
            border: 1px solid #e74c3c;
            color: #e74c3c;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-remove:hover {
            background: #e74c3c;
            color: white;
        }

        .empty-list {
            text-align: center;
            padding: 32px 16px;
            color: #666;
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #9b59b6;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .back-link svg {
            width: 16px;
            height: 16px;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z" />
                </svg>
                Remote NIP-07
            </h1>
            <button id="btnShowList" class="btn-icon" title="All connected sites">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z" />
                </svg>
            </button>
        </div>

        <!-- Main Page: Current Site -->
        <div id="pageCurrent" class="page active">
            <div class="current-site">
                <div class="current-host">Current tab: <strong id="currentHost">-</strong></div>
            </div>

            <!-- State: Connected -->
            <div id="stateConnected" class="connected-state" style="display: none;">
                <div class="connected-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" />
                    </svg>
                </div>
                <div class="connected-title">Connected</div>
                <div class="connected-pubkey" id="connectedPubkey"></div>
                <button id="btnDisconnect" class="btn-disconnect">Disconnect</button>
            </div>

            <!-- State: QR Code -->
            <div id="stateQR" class="qr-state" style="display: none;">
                <div class="qr-title">Scan with Amber</div>
                <div class="qr-subtitle">Connect this site to your Nostr identity</div>
                <div class="qr-container">
                    <canvas id="qrCanvas"></canvas>
                </div>
                <div class="waiting-indicator">
                    <div class="spinner"></div>
                    <span>Waiting for connection...</span>
                </div>
            </div>

            <!-- State: Not Connected (no pending) -->
            <div id="stateNotConnected" class="not-connected-state" style="display: none;">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
                </svg>
                <p>Not connected</p>
                <p style="font-size: 12px; margin-top: 8px;">
                    This site hasn't requested access yet.
                </p>
            </div>
        </div>

        <!-- Sites List Page -->
        <div id="pageList" class="page">
            <div class="back-link" id="btnBack">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                </svg>
                Back
            </div>
            <div class="section-title">All Connected Sites</div>
            <div id="siteList" class="site-list"></div>
        </div>
    </div>

    <script src="popup.js" type="module"></script>
</body>

</html>
