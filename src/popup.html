<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote NIP-07</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
            width: 320px;
            min-height: 200px;
            padding: 16px;
            background: #1a1a2e;
            color: #eee;
        }

        h1 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #9d4edd;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h1::before {
            content: "⚡";
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .status.connected {
            background: rgba(46, 204, 113, 0.15);
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        .status.disconnected {
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .status.connected .status-dot {
            background: #2ecc71;
            box-shadow: 0 0 8px #2ecc71;
        }

        .status.disconnected .status-dot {
            background: #e74c3c;
        }

        .pubkey {
            font-family: monospace;
            font-size: 11px;
            color: #888;
            word-break: break-all;
            margin-top: 4px;
        }

        .section {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #16213e;
            color: #eee;
            font-size: 13px;
            font-family: monospace;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #9d4edd;
        }

        input[type="text"]::placeholder {
            color: #555;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.primary {
            background: linear-gradient(135deg, #9d4edd 0%, #7b2cbf 100%);
            color: white;
        }

        button.primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(157, 78, 221, 0.4);
        }

        button.primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        button.danger {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }

        button.danger:hover {
            background: rgba(231, 76, 60, 0.3);
        }

        .error {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 8px;
            padding: 8px;
            background: rgba(231, 76, 60, 0.1);
            border-radius: 4px;
        }

        .hidden {
            display: none !important;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .qr-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: white;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        #qr-code canvas {
            display: block;
        }

        .help-text {
            font-size: 11px;
            color: #666;
            text-align: center;
            margin-top: 8px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 16px 0;
            color: #555;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #333;
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
        }

        .tab {
            flex: 1;
            padding: 8px;
            background: transparent;
            border: 1px solid #333;
            color: #888;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab:first-child {
            border-radius: 6px 0 0 6px;
        }

        .tab:last-child {
            border-radius: 0 6px 6px 0;
        }

        .tab.active {
            background: rgba(157, 78, 221, 0.2);
            border-color: #9d4edd;
            color: #9d4edd;
        }

        .tab:hover:not(.active) {
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .qr-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            background: white;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .qr-wrapper canvas {
            display: block;
        }

        .waiting {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            background: rgba(157, 78, 221, 0.1);
            border: 1px solid rgba(157, 78, 221, 0.3);
            border-radius: 6px;
            color: #9d4edd;
            font-size: 13px;
            margin-bottom: 12px;
        }

        button.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #888;
            border: 1px solid #333;
        }

        button.secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #aaa;
        }
    </style>
</head>

<body>
    <h1>Remote NIP-07</h1>

    <!-- Connected State -->
    <div id="connected-view" class="hidden">
        <div class="status connected">
            <div class="status-dot"></div>
            <div>
                <div>Connected to Amber</div>
                <div class="pubkey" id="display-pubkey"></div>
            </div>
        </div>
        <button class="danger" id="disconnect-btn">Disconnect</button>
    </div>

    <!-- Disconnected State -->
    <div id="disconnected-view">
        <div class="status disconnected">
            <div class="status-dot"></div>
            <div>Not connected</div>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="qr">Scan QR</button>
            <button class="tab" data-tab="paste">Paste URI</button>
        </div>

        <!-- QR Code Tab -->
        <div id="tab-qr" class="tab-content active">
            <div id="qr-wrapper" class="qr-wrapper hidden">
                <img id="qr-image" alt="QR Code" width="200" height="200">
            </div>
            <div id="waiting-message" class="waiting hidden">
                <span class="spinner"></span>
                Waiting for Amber...
            </div>
            <button class="primary" id="generate-qr-btn">
                <span class="btn-text">Generate QR Code</span>
            </button>
            <button class="secondary hidden" id="cancel-btn">Cancel</button>
            <p class="help-text">
                Scan with Amber to connect
            </p>
        </div>

        <!-- Paste URI Tab -->
        <div id="tab-paste" class="tab-content">
            <div class="section">
                <label for="bunker-input">Bunker URI</label>
                <input type="text" id="bunker-input" placeholder="bunker://pubkey?relay=wss://..." spellcheck="false"
                    autocomplete="off">
            </div>

            <button class="primary" id="connect-btn">
                <span class="btn-text">Connect to Amber</span>
            </button>

            <p class="help-text">
                Open Amber → Settings → Nostr Connect → Copy bunker URI
            </p>
        </div>

        <div id="error-message" class="error hidden"></div>
    </div>

    <script src="lib/qrcode.min.js"></script>
    <script type="module" src="popup.js"></script>
</body>

</html>
